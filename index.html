<script type="text/babel">
const __TWEAKS_STYLE = `

function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
  }, []);
  return [values, setTweak];
}

function TweaksPanel({ title = 'Tweaks', children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;
  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    offsetRef.current = {
      x: Math.min(Math.max(PAD, window.innerWidth - w - PAD), Math.max(PAD, offsetRef.current.x)),
      y: Math.min(Math.max(PAD, window.innerHeight - h - PAD), Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);
  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);
  const dismiss = () => { setOpen(false); window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*'); };
  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = { x: startRight - (ev.clientX - sx), y: startBottom - (ev.clientY - sy) };
      clampToViewport();
    };
    const up = () => { window.removeEventListener('mousemove', move); window.removeEventListener('mouseup', up); };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };
  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel" style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" onMouseDown={e => e.stopPropagation()} onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">{children}</div>
      </div>
    </>
  );
}

function TweakSection({ label }) { return <div className="twk-sect">{label}</div>; }

function TweakRow({ label, children }) {
  return (
    <div className="twk-row">
      <div className="twk-lbl"><span>{label}</span></div>
      {children}
    </div>
  );
}

function TweakText({ label, value, placeholder, onChange }) {
  return (
    <TweakRow label={label}>
      <input className="twk-field" type="text" value={value} placeholder={placeholder}
             onChange={e => onChange(e.target.value)} />
    </TweakRow>
  );
}

function TweakSelect({ label, value, options, onChange }) {
  return (
    <TweakRow label={label}>
      <select className="twk-field" value={value} onChange={e => onChange(e.target.value)}>
        {options.map(o => {
          const v = typeof o === 'object' ? o.value : o;
          const l = typeof o === 'object' ? o.label : o;
          return <option key={v} value={v}>{l}</option>;
        })}
      </select>
    </TweakRow>
  );
}

Object.assign(window, { useTweaks, TweaksPanel, TweakSection, TweakText, TweakSelect });

<script type="text/babel">

const useScaleToFit = (w, h) => {
  const [scale, setScale] = React.useState(1);
  React.useEffect(() => {
    const calc = () => {
      const sw = window.innerWidth / (w + 60);
      const sh = window.innerHeight / (h + 60);
      setScale(Math.min(sw, sh, 1));
    };
    calc();
    window.addEventListener('resize', calc);
    return () => window.removeEventListener('resize', calc);
  }, [w, h]);
  return scale;
};

function Wordmark({ size = 26, color = T.ink }) {
  return (
    <div style={{
      fontFamily: SANS, fontWeight: 800, fontSize: size,
      letterSpacing: '-0.04em', color, lineHeight: 1,
      display: 'inline-flex', alignItems: 'baseline', gap: 6,
    }}>
      <span>sam</span>
      <span style={{
        width: 6, height: 6, background: color, borderRadius: '50%',
        display: 'inline-block', alignSelf: 'center', marginBottom: 2,
      }}/>
    </div>
  );
}

function Eyebrow({ children, color, style = {} }) {
  return (
    <div style={{
      fontFamily: SANS, fontWeight: 600, fontSize: 11,
      letterSpacing: '0.04em', textTransform: 'lowercase',
      color: color || T.inkMid, ...style,
    }}>{children}</div>
  );
}

function PillButton({ onClick, disabled, children, emoji, variant = 'solid', style = {} }) {
  const base = {
    fontFamily: SANS, fontWeight: 600, fontSize: 15,
    letterSpacing: '-0.005em',
    padding: '20px 28px',
    borderRadius: 999,
    border: variant === 'outline' ? `1.5px solid ${T.ink}` : 'none',
    background: variant === 'outline' ? 'transparent' : T.ink,
    color: variant === 'outline' ? T.ink : T.paper,
    cursor: disabled ? 'not-allowed' : 'pointer',
    display: 'inline-flex', alignItems: 'center', justifyContent: 'center', gap: 10,
    transition: 'transform 0.15s ease, background 0.15s ease',
    opacity: disabled ? 0.35 : 1,
    width: '100%',
    ...style,
  };
  return (
    <button onClick={onClick} disabled={disabled} style={base}
      onMouseEnter={e => { if (!disabled) e.currentTarget.style.transform = 'translateY(-1px)'; }}
      onMouseLeave={e => { e.currentTarget.style.transform = 'translateY(0)'; }}
    >
      {emoji && <span style={{ fontSize: 16 }}>{emoji}</span>}
      <span>{children}</span>
    </button>
  );
}

function Rule({ my = 24, color }) {
  return <div style={{ height: 1, background: color || T.rule, marginTop: my, marginBottom: my, width: '100%' }} />;
}

/* ─────────────────────────────────────────

───────────────────────────────────────── */
function IdleScreen({ onTap, tweaks }) {

  const [wobble, setWobble] = React.useState(false);

  React.useEffect(() => {
    const t1 = setTimeout(() => setPopped(true), 900);
    return () => clearTimeout(t1);
  }, []);

  React.useEffect(() => {
    if (!popped) return;
    const loop = setInterval(() => {
      setWobble(true);
      setTimeout(() => setWobble(false), 600);
    }, 3000);
    return () => clearInterval(loop);
  }, [popped]);

  return (
    <>
      <style>{`
        @keyframes popUp {
          0%   { transform: translateY(120%) scale(0.85); opacity: 0; }
          60%  { transform: translateY(-8%) scale(1.04); opacity: 1; }
          80%  { transform: translateY(4%) scale(0.98); }
          100% { transform: translateY(0%) scale(1); opacity: 1; }
        }
        @keyframes idleWobble {
          0%,100% { transform: rotate(0deg) scale(1); }
          20%     { transform: rotate(-6deg) scale(1.06); }
          40%     { transform: rotate(5deg) scale(1.06); }
          60%     { transform: rotate(-3deg) scale(1.03); }

          100% { transform: scale(2.6); opacity: 0; }
        }

function UnlockScreen({ teamName, onComplete }) {
  const [phase, setPhase] = React.useState(0);

  React.useEffect(() => {
    const t1 = setTimeout(() => setPhase(1), 500);
    const t2 = setTimeout(() => setPhase(2), 1900);
    const t3 = setTimeout(() => onComplete(), 2700);
    return () => { clearTimeout(t1); clearTimeout(t2); clearTimeout(t3); };
  }, []);

  return (
    <div style={{
      width: '100%', height: '100%',
      background: T.ink,
      display: 'flex', flexDirection: 'column',
      alignItems: 'center', justifyContent: 'center',
      position: 'relative', overflow: 'hidden',
    }}>
      {[0, 1, 2, 3].map(i => (
        <div key={i} style={{
          position: 'absolute',
          width: 80 + i * 200, height: 80 + i * 200,
          borderRadius: '50%',
          border: `1.5px solid rgba(255,225,77,${0.45 - i * 0.09})`,
          animation: `ringExpand 1.3s cubic-bezier(0.22,1,0.36,1) ${i * 0.1}s both`,
        }}/>
      ))}

      <div style={{
        position: 'absolute', top: '50%', left: '50%',
        transform: phase >= 1 ? 'translate(-50%, calc(-50% - 80px))' : 'translate(-50%, -50%)',
        opacity: phase < 2 ? 1 : 0,
        transition: 'transform 0.6s cubic-bezier(0.4,0,0.2,1), opacity 0.6s ease',
      }}>
        <Wordmark size={28} color={T.paper}/>
      </div>

      <div style={{
        textAlign: 'center', zIndex: 2,
        opacity: phase >= 1 ? 1 : 0,
        transform: phase >= 1 ? 'translateY(0)' : 'translateY(12px)',
        transition: 'opacity 0.6s ease, transform 0.6s ease',
      }}>

function MoodScreen({ teamName, onSelect }) {
  const [selected, setSelected] = React.useState(null);

  const handlePick = (mood) => {
    if (busy) return;
    setBusy(true);
    setSelected(mood.id);
    setTimeout(() => setToastVisible(true), 300);
    setTimeout(() => onSelect(mood.id), 2200);
  };

  const selectedMood = MOODS.find(m => m.id === selected);
  const bgColor = selectedMood ? selectedMood.accent + '55' : T.paper;

  return (
    <>

        @keyframes moodPulse {
          0%,100% { opacity: 1; transform: scale(1); }

          from { transform: translateX(-50%) translateY(20px); opacity: 0; }
          to   { transform: translateX(-50%) translateY(0);    opacity: 1; }

      <div style={{

        display: 'flex', flexDirection: 'column',
        color: T.ink, position: 'relative', overflow: 'hidden',
        transition: 'background 0.6s ease',
      }}>

        <ScreenHeader teamName={teamName} badgeStyle={{ background: T.ink, color: T.paper }} />

        <div style={{ padding: '28px 40px 0', flex: 1, display: 'flex', flexDirection: 'column', overflow: 'hidden' }}>

  const boards = MOODBOARDS_DATA[chosenMood] || MOODBOARDS_DATA.ethereal;
  const songs = PLAYLISTS[chosenMood] || PLAYLISTS.ethereal;
  const selectedBoardData = selectedBoard !== null ? boards[selectedBoard] : null;

  /* ── Phase 1: moodboard selection ── */
  if (phase === 'moodboards') {
    return (
      <div style={{
        width: '100%', height: '100%',
        background: T.paper,
        display: 'flex', flexDirection: 'column',
        color: T.ink, overflow: 'hidden',
        opacity: fadeIn ? 1 : 0, transition: 'opacity 0.5s ease',
      }}>
        <ScreenHeader teamName={teamName} badgeStyle={{ background: mood.accent, color: T.ink }} />

        <div style={{ padding: '24px 40px 0', flex: 1, display: 'flex', flexDirection: 'column', overflow: 'hidden' }}>

          <Eyebrow style={{ marginBottom: 10 }}>your {mood.label} era unlocked 4 moodboards</Eyebrow>

          <h2 style={{
            fontFamily: SANS, fontSize: 34, fontWeight: 800, lineHeight: 1.0,
            color: T.ink, letterSpacing: '-0.04em', marginBottom: 8,
          }}>
            pick the one that<br/>hits closest ✨
          </h2>

          <p style={{
            fontFamily: SERIF, fontSize: 14, fontWeight: 400,
            fontStyle: 'italic', color: T.inkMid, marginBottom: 20,
          }}>
            your selection will generate a playlist that matches your vibe
          </p>

          {/* 2×2 moodboard grid */}
          <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 12, flex: 1, alignContent: 'start' }}>
            {boards.map((board, i) => (
              <MoodboardCard
                key={i}
                board={board}
                selected={selectedBoard === i}
                onClick={() => setSelectedBoard(selectedBoard === i ? null : i)}
              />
            ))}
          </div>

          {/* Lock in CTA */}
          <div style={{
            paddingTop: 16, paddingBottom: 28,
            opacity: selectedBoard !== null ? 1 : 0.3,
            transition: 'opacity 0.3s ease',
          }}>
            <PillButton
              onClick={() => selectedBoard !== null && setPhase('playlist')}
              disabled={selectedBoard === null}
              emoji="🎵"
            >
              generate my playlist
            </PillButton>
          </div>
        </div>
      </div>
    );
  }

  /* ── Phase 2: playlist ── */
  return (
    <div style={{
      width: '100%', height: '100%',
      background: T.paper,
      display: 'flex', flexDirection: 'column',
      color: T.ink, overflow: 'hidden',
    }}>
      {/* Header with moodboard accent */}
      <div style={{
        padding: '24px 40px', display: 'flex',
        justifyContent: 'space-between', alignItems: 'center',
        borderBottom: `1px solid ${T.rule}`, flexShrink: 0,
        background: selectedBoardData
          ? `linear-gradient(90deg, ${selectedBoardData.gradient.match(/#[a-f0-9]{6}/i)?.[0] || mood.accent}22 0%, transparent 100%)`
          : T.paper,
      }}>
        <Wordmark size={20}/>
        <div style={{
          display: 'flex', alignItems: 'center', gap: 8,
          background: T.ink, color: T.paper,
          padding: '6px 14px', borderRadius: 999,
          fontFamily: SANS, fontWeight: 600, fontSize: 11,
        }}>
          <span>🎵</span>
          <span>{selectedBoardData?.title || mood.label}</span>
        </div>
      </div>

      <div style={{ padding: '20px 40px 0', flex: 1, display: 'flex', flexDirection: 'column', overflow: 'hidden' }}>

        <div style={{
          display: 'flex', alignItems: 'center', gap: 10,
          padding: '10px 14px', borderRadius: 12,
          background: `linear-gradient(135deg, ${mood.accent}66, ${mood.accent}22)`,
          marginBottom: 18,
        }}>
          <span style={{ fontSize: 20 }}>{mood.emoji}</span>
          <div>
            <div style={{ fontFamily: SANS, fontWeight: 700, fontSize: 13, color: T.ink }}>
              {selectedBoardData?.title}
            </div>
            <div style={{ fontFamily: MONO, fontSize: 10, color: T.inkMid, marginTop: 1 }}>
              {selectedBoardData?.tags.join(' ')}
            </div>
          </div>
        </div>

        <Eyebrow style={{ marginBottom: 6 }}>your playlist just dropped</Eyebrow>

        <h2 style={{
          fontFamily: SANS, fontSize: 30, fontWeight: 800, lineHeight: 1.0,
          color: T.ink, letterSpacing: '-0.04em', marginBottom: 18,
        }}>
          this is your {mood.label}<br/>era on shuffle 🎶
        </h2>

        {/* Song list */}
        <div style={{ flex: 1, overflow: 'auto', marginRight: -4, paddingRight: 4 }}>
          {songs.map((song, i) => <SongCard key={i} song={song} index={i} />)}
        </div>

        {/* Bottom CTAs */}
        <div style={{ paddingTop: 16, paddingBottom: 28, display: 'flex', flexDirection: 'column', gap: 10, flexShrink: 0 }}>
          <PillButton emoji="🔁" variant="outline" onClick={() => { setSelectedBoard(null); setPhase('moodboards'); }}>
            pick a different moodboard
          </PillButton>
          <PillButton onClick={onReset} emoji="↩">
            back to the gallery
          </PillButton>
        </div>
      </div>
    </div>
  );
}

/* ─────────────────────────────────────────
   MAIN APP
───────────────────────────────────────── */
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "artistLabel": "katsushika ōi, attributed"
}/*EDITMODE-END*/;

function App() {
  const [tweaks, setTweak] = window.useTweaks(TWEAK_DEFAULTS);
  const [screen, setScreen] = React.useState('idle');
  const [teamName, setTeamName] = React.useState('');
  const [chosenMood, setChosenMood] = React.useState('');

  const scale = useScaleToFit(768, 1024);

  const handleTap = () => {
    const name = TEAM_NAMES[Math.floor(Math.random() * TEAM_NAMES.length)];
    setTeamName(name);
    setScreen('unlock');
  };
  const handleUnlockDone  = () => setScreen('mood');
  const handleSelectMood  = (moodId) => { setChosenMood(moodId); setScreen('save'); };
  const handleSave        = () => setScreen('completion');
  const handleReset       = () => { setTeamName(''); setChosenMood(''); setScreen('idle'); };

  const renderScreen = () => {
    switch (screen) {
      case 'idle':       return <IdleScreen onTap={handleTap} tweaks={tweaks} />;
      case 'unlock':     return <UnlockScreen teamName={teamName} onComplete={handleUnlockDone} />;
      case 'mood':       return <MoodScreen teamName={teamName} onSelect={handleSelectMood} />;
      case 'save':       return <SaveScreen teamName={teamName} chosenMood={chosenMood} onSave={handleSave} tweaks={tweaks} />;
      case 'completion': return <CompletionScreen teamName={teamName} chosenMood={chosenMood} onReset={handleReset} />;
      default: return null;
    }
  };

  return (
    <>
      <div style={{
        transform: `scale(${scale})`,
        transformOrigin: 'center center',
        transition: 'transform 0.2s ease',
      }}>
        <div className="tablet-shell" data-screen-label={`Tablet — ${screen}`}>
          <div style={{
            position: 'absolute', top: 14, left: 0, right: 0,
            display: 'flex', justifyContent: 'center',
            zIndex: 100, pointerEvents: 'none',
          }}>
            <div style={{
              width: 100, height: 5,
              background: 'rgba(255,255,255,0.15)', borderRadius: 10,
            }}/>
          </div>

          <div className="tablet-screen">
            <div style={{ position: 'absolute', inset: 0 }}>
              {renderScreen()}
            </div>
          </div>
        </div>

        <div style={{
          textAlign: 'center', marginTop: 18,
          fontFamily: MONO, fontSize: 10, letterSpacing: '0.04em',
          color: 'rgba(0,0,0,0.3)',
        }}>
          sam · breadcrumbs · interactive tablet prototype
        </div>
      </div>

      <window.TweaksPanel>
        <window.TweakSection label="content" />
        <window.TweakText
          label="artist label"
          value={tweaks.artistLabel}
          onChange={v => setTweak('artistLabel', v)}
        />
        <window.TweakSection label="screens" />
        <window.TweakSelect
          label="jump to screen"
          options={['idle','unlock','mood','save','completion']}
          value={screen}
          onChange={v => {
            if (v !== 'idle' && !teamName) setTeamName(TEAM_NAMES[0]);
            if ((v === 'save' || v === 'completion') && !chosenMood) setChosenMood('ethereal');
            setScreen(v);
          }}
        />
      </window.TweaksPanel>
    </>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
